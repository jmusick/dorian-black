# Worker serving Astro's static build and the contact endpoint.
name = "dorian-black"
account_id = "fdabb6996edf7688fdaf7c8c367f7d08"
main = "worker/index.ts"
compatibility_date = "2026-10-11"
# Disable the *.workers.dev hostname (and per-version preview URLs): zone WAF,
# rate-limit and header rules on dorianblack.com do not apply to those hosts.
workers_dev = false
preview_urls = false
routes = [{ pattern = "dorianblack.com", custom_domain = true }]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
# Unknown paths get dist/404.html with a real 404 status.
not_found_handling = "404-page"

# Secrets are uploaded separately; values never belong in this file.
[secrets]
required = ["CLOUDFLARE_API_TOKEN", "TURNSTILE_SECRET_KEY"]

[vars]
CLOUDFLARE_ACCOUNT_ID = "fdabb6996edf7688fdaf7c8c367f7d08"
EMAIL_FROM_CONTACT = "contact@dorianblack.com"
CONTACT_TO_EMAIL = "hello@dorianblack.com"
# Request checks in worker/contact.ts. These are the production values;
# .dev.vars overrides them locally (see .dev.vars.example). Do not loosen them.
ALLOWED_ORIGIN = "https://dorianblack.com"
TURNSTILE_HOSTNAME = "dorianblack.com"
TURNSTILE_ACTION = "contact"

# Per-IP throttle for POST /api/contact. The binding only supports a 10 s or
# 60 s period; counters are per Cloudflare location and eventually consistent.
# namespace_id must be unique within the account (same id = shared counters).
[[ratelimits]]
name = "CONTACT_LIMITER"
namespace_id = "810301"

  [ratelimits.simple]
  limit = 3
  period = 60

[observability]
enabled = true

[observability.traces]
enabled = true
head_sampling_rate = 0.01
